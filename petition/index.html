<!DOCTYPE html>
<html lang="ckb" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>عەریزا مۆلەتێ — ڤەرژنا ٢</title>
<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.6 var(--font);padding:14px max(14px,env(safe-area-inset-right)) 40px max(14px,env(safe-area-inset-left))}
.app{direction:rtl;max-width:760px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
h1{font-size:1.25rem;margin:0}
h2{font-size:1.1rem;margin:0 0 8px}h3{font-size:1rem;margin:0 0 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.fld label{font-size:.9rem;color:var(--muted)}
.in{width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.in[aria-invalid=true]{border-color:var(--bad)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:420px){.grid2.stack{grid-template-columns:1fr}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{min-height:44px;padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.btn.small{min-height:36px;padding:4px 12px;font-size:.9rem}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700}
.btn.big{width:100%;min-height:56px;font-size:1.2rem}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.seg button{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;padding:4px 6px;font-size:.92rem}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700}
.info{background:var(--bg);border-radius:10px;padding:10px 12px;margin:4px 0 12px;font-size:.95rem}
.info b{font-weight:700}
.alert{border-radius:10px;padding:8px 12px;margin:6px 0;background:var(--warn-bg);color:var(--warn);font-size:.92rem}
.alert.bad{background:var(--bad-bg);color:var(--bad)}
.ok{background:var(--ok-bg);color:var(--ok)}
.hint{color:var(--muted);font-size:.85rem}
.ltrd{unicode-bidi:isolate;direction:ltr;display:inline-block}
details.dd{margin:0 0 10px;border:1px dashed var(--line);border-radius:10px;padding:6px 10px}
details.dd summary{cursor:pointer;min-height:36px;display:flex;align-items:center;color:var(--muted)}
.done{border:2px solid var(--ok);background:var(--ok-bg);color:var(--fg);border-radius:14px;padding:14px;margin-bottom:12px}
.done .sn{font-size:1.5rem;font-weight:700}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px}
.tabs button{flex:0 0 auto;min-height:40px;padding:4px 14px;border:1px solid var(--line);border-radius:20px;background:var(--surface);cursor:pointer}
.tabs button[aria-selected=true]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:8px 0}
.stat{background:var(--bg);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column}
.stat .k{font-size:.8rem;color:var(--muted)}.stat .v{font-size:1.2rem;font-weight:700}
.stat.neg .v,.neg{color:var(--bad)}
.scroll{overflow-x:auto}
table.tbl{border-collapse:collapse;width:100%;font-size:.9rem}
.tbl th,.tbl td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.empty{color:var(--muted);text-align:center;padding:12px}
.ecard{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:right;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:8px;cursor:pointer}
.ecard .n{font-weight:700}.ecard .s{font-size:.85rem;color:var(--muted)}
.pcard{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.chk{display:flex;gap:8px;align-items:center;min-height:36px}
.chk input{width:20px;height:20px}
canvas.pad{width:100%;border:1px dashed var(--line);border-radius:10px;background:#fff;touch-action:none}
canvas.prev{width:100%;height:auto;border:1px solid var(--line);background:#fff}
.stamp-prev img{max-height:90px;background:#fff;border:1px solid var(--line);border-radius:8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px 12px;z-index:20}
.modal[hidden]{display:none}
.mcard{background:var(--surface);border-radius:14px;padding:16px;width:100%;max-width:520px}
.viewer{position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:30;padding:12px}
.viewer[hidden]{display:none}
.viewer img{width:100%;max-width:700px;display:block;margin:10px auto;background:#fff}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);max-width:92vw;background:#1B2433;color:#fff;padding:10px 16px;border-radius:12px;z-index:40;font-size:.92rem}
.toast[hidden]{display:none}
.drop{border:2px dashed var(--line);border-radius:12px;padding:10px;text-align:center;color:var(--muted);font-size:.9rem;margin-top:10px}
.drop.over{border-color:var(--accent);background:var(--bg)}
.tag{font-size:.75rem;color:var(--muted)}
.hol{list-style:none;padding:0;margin:8px 0}.hol li{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--line)}
input[type=range]{width:100%}
</style></head><body>

  <section id="v-more" hidden></section>

      var ex = recById(r.id);
      if (!ex || String(r.updatedAt || '') > String(ex.updatedAt || '')) { var n = normRec(r); upsert(records, n); saveRec(n); nr++; }
    });
    (o.employees || []).forEach(function (e) {
      if (!e || typeof e.id !== 'string' || !e.name) return;
      if (!findEmp(e.id) && !findEmpByName(e.name)) { employees.push(e); saveEmp(e); ne++; }
    });
    if (o.settings) {
      var s = normSettings(o.settings);
      s.holidays = s.holidays.concat(settings.holidays.filter(function (x) { return !s.holidays.some(function (y) { return y.d === x.d; }); }));
      Object.keys(settings.serials).forEach(function (y) { s.serials[y] = Math.max(s.serials[y] || 0, settings.serials[y]); });
      records.forEach(function (r) { if (r.serial && (s.serials[r.serial.y] || 0) < r.serial.n) s.serials[r.serial.y] = r.serial.n; });
      settings = s; saveSettings();
    }
    if (o.stamp && !stamp) { stamp = o.stamp; saveStamp(); }
    if (o.sig && !sigImg) { sigImg = o.sig; saveSig(); }
    sortRecords(); sortEmps(); renderMore();
    toast('هاتە ڤەگەڕاندن: ' + ar(nr) + ' عەریزە و ' + ar(ne) + ' کارمەند');
  }
  function importFile(f) {
    var rd = new FileReader();
    rd.onload = function () { var o; try { o = JSON.parse(rd.result); } catch (e) { o = null; } importObject(o); };
    rd.readAsText(f);
  }
  function renderBackup(V) {
    if (WEB) {
      var ef = h('input', { type: 'file', id: 'imp-enc', class: 'in' }), ep = h('input', { class: 'in', id: 'imp-enc-pw', type: 'password', placeholder: 'پاسۆۆردا ڤی فایلی', autocomplete: 'off' });
      var op = h('input', { class: 'in', id: 'pw-old', type: 'password', placeholder: 'پاسۆۆردا نوکە', autocomplete: 'current-password' }), np = h('input', { class: 'in', id: 'pw-new', type: 'password', placeholder: 'پاسۆۆردا نوی (٨ پیت و زێدەتر)', autocomplete: 'new-password' });
      prepBackup(); V.append(bioCard());
      V.append(h('div', { class: 'card' }, h('h2', { text: 'کۆپییا پاراستنێ ب پاسۆۆرد' }),
        h('p', { class: 'hint', text: 'عەریز و کارمەند ل سەر ڤی ئامیری دهێنە پاراستن. کۆپییەکێ د «Files» یان iCloud دا بپارێزە. ئەڤ فایلە ب هەمان پاسۆۆرد هاتیە قفلکرن.' }),
        h('p', { class: 'hint', id: 'bk-state', text: unbacked() ? ar(unbacked()) + ' عەریزە ژ کۆپییا دوماهیێ نوینە.' : 'هەمی عەریز د کۆپییا دوماهیێ دا نە.' }),
        h('div', { class: 'row', style: 'margin:10px 0' },
          h('button', { class: 'btn primary', id: 'bk-enc', type: 'button', text: 'کۆپییا پاراستنێ دروست بکە', onclick: async function () { await exportEnc(); renderMore(); } }),
          h('button', { class: 'btn', id: 'bk-share', type: 'button', text: 'پاراستن ل Files', onclick: shareBackup }),
          h('button', { class: 'btn', id: 'bk-csv', type: 'button', text: 'هەمی عەریزان ب CSV', onclick: function () { saveFile('petitions-all-' + dkey(today()) + '.csv', csvOf(detailRows(records.slice().sort(byLeave)))); } })),
        fld('ڤەگەڕاندن ژ فایلەکێ (.enc)', 'imp-enc', ef), ep,
        h('button', { class: 'btn small', id: 'imp-enc-go', type: 'button', style: 'margin-top:8px', text: 'ڤەگەڕاندن', onclick: async function () {
          if (!ef.files || !ef.files[0] || !ep.value) { toast('فایل و پاسۆۆردی بنڤیسە'); return; }
          try { var r = await readEnc(ef.files[0], ep.value); importObject(JSON.parse(r.text)); } catch (e) { toast('پاسۆۆرد یان فایل یێ خەلەتە'); }
        } })),
        h('div', { class: 'card' }, h('h2', { text: 'گوهۆڕینا پاسۆۆردی' }), op, h('div', { style: 'margin-top:8px' }, np),
          h('button', { class: 'btn small', id: 'pw-go', type: 'button', style: 'margin-top:8px', text: 'گوهۆڕین', onclick: async function () {
            if (np.value.length < 8) { toast('پاسۆۆرد دڤێت ٨ پیتان کێمتر نەبیت'); return; }
            if (await changePassword(op.value, np.value)) { op.value = ''; np.value = ''; renderMore(); }
          } })));
      return;
    }
    var imp = h('input', { type: 'file', accept: '.json,application/json', id: 'imp-file', class: 'in' });
    imp.addEventListener('change', function () { if (imp.files && imp.files[0]) importFile(imp.files[0]); });
    V.append(h('div', { class: 'card' }, h('h2', { text: 'کۆپییا پاراستنێ' }),
      h('p', { class: 'hint', text: 'هەمی عەریزە، کارمەند و ڕێکخستن د یەک فایلی دا. کۆپییێن ژ ڤەرژنا کەڤن ژی دهێنە ڤەگەڕاندن.' }),
      h('div', { class: 'row', style: 'margin:10px 0' },
        h('button', { class: 'btn primary', id: 'bk-json', type: 'button', text: 'کۆپییا پاراستنێ دروست بکە', onclick: exportJson }),
        h('button', { class: 'btn', id: 'bk-csv', type: 'button', text: 'هەمی عەریزان ب CSV', onclick: function () { saveFile('petitions-all-' + dkey(today()) + '.csv', csvOf(detailRows(records.slice().sort(byLeave)))); } })),
      fld('ڤەگەڕاندن ژ کۆپییەکا پاراستنێ', 'imp-file', imp),
      h('p', { class: 'hint', id: 'mode-note', text: store.mode === 'cloud' ? 'عەریزێن تە د هەژمارا تە دا دهێنە پاشەکەفتکرن و دشێی ژ هەر ئامیرەکی ڤەکەی.' : 'عەریزە تنێ د ڤی وێبگەرێدا دهێنە پاشەکەفتکرن. کۆپییەکا پاراستنێ دروست بکە.' })));
  }

  /* ---------- memory: cloud (db) when available, this browser always ---------- */
  function whenIdle(key, fn) { if (inflight > 0) deferred[key] = fn; else fn(); }
  function refreshLists() {
    function fill(id, key) {
      var seen = {}, dlst = $('#' + id); if (!dlst) return; clear(dlst);
      employees.map(function (e) { return e[key]; }).concat(records.map(function (r) { return r[key]; })).forEach(function (v) { v = trimName(v); if (v && !seen[v]) { seen[v] = 1; dlst.append(h('option', { value: v })); } });
    }
    fill('dl-place', 'place'); fill('dl-title', 'title'); fill('dl-dept', 'dept');
  }
  function onData() {
    refreshLists();
    if (view === 'more') refreshMore();
    else if (WEB && !encKey) return;
    else if (scan) buildMain();
    else if (!busy && step === 1 && !(document.activeElement && /^(INPUT|SELECT)$/.test(document.activeElement.tagName))) buildMain();
  }
  async function init() {
    var cl = window.claude, user = null, id = null, db = null;
    cloudPending = true;
    try { if (cl && cl.use) { user = await cl.use('user'); id = user ? await user.id() : null; } } catch (e) { }
    try { if (cl && cl.use && id) db = await cl.use('db'); } catch (e) { }
    try { if (cl && cl.use) dl = await cl.use('downloads'); } catch (e) { }
    if (db && id) {
      try {
        store.base = db.doc('data/users/' + id + '/profile'); store.mode = 'cloud';
        await pushPend();
        store.base.collection('petitions').orderBy('createdAt', 'desc').limit(1000).onSnapshot(function (snap) {
          whenIdle('p', function () { records = mergeCloud('petitions', fromSnap(snap).map(normRec), records); sortRecords(); mirror(); onData(); });
        }, function () { toast('نەشیا پاشەکەفتکری نوی بکەت'); });
        store.base.collection('employees').limit(500).onSnapshot(function (snap) {
          whenIdle('e', function () { employees = mergeCloud('employees', fromSnap(snap), employees); sortEmps(); mirror(); onData(); });
        }, function () { });
        store.base.collection('meta').doc('settings').onSnapshot(function (s) {
          whenIdle('s', function () {
            if (sTimer || !s.exists) return;
            var local = settings; settings = normSettings(s.data());
            Object.keys(local.serials || {}).forEach(function (y) { settings.serials[y] = Math.max(settings.serials[y] || 0, local.serials[y]); });
            mirror();
          });
        }, function () { });
        store.base.collection('meta').doc('stamp').onSnapshot(function (s) {
          whenIdle('t', function () { if (pend['meta/stamp']) return; if (s.exists) { stamp = (s.data() || {}).img || null; mirror(); } });
        }, function () { });
        store.base.collection('meta').doc('sig').onSnapshot(function (s) {
          whenIdle('g', function () { if (pend['meta/sig']) return; if (s.exists) { sigImg = (s.data() || {}).img || null; mirror(); } });
        }, function () { });
      } catch (e) { store.mode = 'local'; }
    }
    cloudPending = false;
  }

  /* ---------- start ---------- */
  function boot() {
    F = newForm(null);
    scan = parseScan(); scanLoading = !!scan && !WEB;
    refreshLists(); buildMain();
    ready = true;
  }
  function start() {
    WEB = !(window.claude && window.claude.use) && !!(window.crypto && crypto.subtle);
    if (WEB) { dl = webDl; APP_URL = location.href.split('#')[0]; }
    $('#btn-more').addEventListener('click', function () { setView(view === 'more' ? 'main' : 'more'); });
    $('#viewer-close').addEventListener('click', closeViewer);
    $('#modal').addEventListener('click', function (e) { if (e.target === $('#modal')) closeModal(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closeViewer(); closeModal(); } });
    var over = 0;
    window.addEventListener('dragover', function (e) { e.preventDefault(); });
    window.addEventListener('dragenter', function (e) { e.preventDefault(); over++; var d = $('#drop'); if (d) d.classList.add('over'); });
    window.addEventListener('dragleave', function () { over = Math.max(0, over - 1); if (!over) { var d = $('#drop'); if (d) d.classList.remove('over'); } });
    window.addEventListener('drop', function (e) {
      e.preventDefault(); over = 0; var d = $('#drop'); if (d) d.classList.remove('over');
      if (WEB && !encKey) return;
      var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (f) importPdf(f);
    });
    document.addEventListener('visibilitychange', function () { if (document.hidden && WEB) webFlush(); else if (!document.hidden) { if (WEB && ghOn()) syncSoon(800); if (view === 'main' && !busy) TODAY = new Date(); } });
    window.addEventListener('pagehide', function () { if (WEB) webFlush(); });
    window.addEventListener('hashchange', function () { if (WEB && !encKey) return; var s = parseScan(); if (s) { scan = s; scanLoading = false; if (view === 'more') setView('main'); else buildMain(); window.scrollTo(0, 0); } });
    if (WEB) {
      try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { }
      unlockFlow(function () {
        var wait = !!parseScan() && ghOn();
        if (wait) { syncNow().then(boot, boot); } else { boot(); if (ghOn()) syncSoon(300); }
      });
      return;
    }
    loadLocal(); boot();
    init().then(function () { if (scanLoading) setTimeout(function () { scanLoading = false; if (scan && view === 'main') buildMain(); }, 1500); });
  }
  start();
})();
